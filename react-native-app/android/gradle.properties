# Project-wide Gradle settings.
android.useAndroidX=true
# React Native 0.70+ uses AndroidX natively, Jetifier speed up-kkaga disable pannalam
android.enableJetifier=false

# Heap memory-a 4GB (4096m) ah mathunga, Kotlin compilation crashes avoid aagum
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC
org.gradle.parallel=true
kotlin.daemon.jvmargs=-Xmx2048m

# React Native Settings
kotlinVersion=1.9.24
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
newArchEnabled=false
hermesEnabled=true
